{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <title>Title</title>
</head>
<body>
<main class="flex-grow-1">
  <div class="container-fluid m-2">
    <div class="row">
      <div class="col-3 d-flex justify-content-center align-items-start">
        <div class="btn-group-vertical w-75" role="group" aria-label="Basic outlined example">
          <a href="{% url 'tasks:index' %}" class="btn btn-outline-primary">
            Home
          </a>
          <a href="{% url 'tasks:tags' %}" class="btn btn-outline-primary">
            Tags
          </a>
        </div>
      </div>
      <div class="col-9">
        {% block content %}

        {% endblock %}
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
