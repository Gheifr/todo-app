{% extends 'base.html' %}

{% block content %}
  <div class="container-fluid">
    <div class="row">
      <div class="col-8"><h1>Tags</h1></div>
      <div class="col-4 d-flex justify-content-end align-items-center">
        <a href="{% url 'tasks:tags_create' %}" class="btn btn-primary">Add</a>
      </div>
    </div>
    <hr>
    {% if tag_list %}
      <table class="table">
        <thead>
        <tr class="">
          <th class="">Name</th>
          <th class="">Update</th>
          <th class="">Delete</th>
        </tr>
        </thead>
        <tbody class="">
        {% for tag in tag_list %}
          <tr class="">
            <td class="">{{ tag.name }}</td>
            <td class="">
              <a href="{% url 'tasks:tags_update' tag.pk %}" class="btn btn-secondary">
                Update
              </a>
            </td>
            <td class="">
              <a href="{% url 'tasks:tags_delete' tag.pk %}" class="btn btn-secondary">
                Delete
              </a>
            </td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    {% else %}
      <h3>No tags yet</h3>
    {% endif %}
  </div>
{% endblock %}
